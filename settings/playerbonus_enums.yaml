# PlayerBonus domain enums. Mirrored from Java source. Edit here when the Java
# enums change; the lookup_* lambdas read this file at import time.
#
# Each section: { id (int) -> human label }.
# `default` is returned when the id isn't in the table; null = return None.

bonus_type_name:
  default: null
  values:
    0: RedeemEligble
    1: FreeSpins
    2: WheelSpin
    3: JackpotWheel
    4: FreeChips

# BonusStatus (usermanagement/.../BonusStatus.java)
bonus_status:
  default: Canceled
  values:
    1: Active
    2: Consumed
    3: Pending
    4: Canceled
    5: Claimable
    6: System Pending
    7: Claimable Pending
    8: Expired

# BonusSpinsStatus (commoninfralib/.../BonusSpinsStatus.java:9-17)
bonus_spins_status:
  default: Unknown Status
  values:
    0: Pending
    1: Initiate
    2: Approved
    3: Started
    4: Declined
    5: Finished
    6: Closed
    7: Canceled
    8: Expired

# BonusWheelSpinStatus (usermanagement/.../BonusWheelSpinStatus.java:10-15)
bonus_wheel_status:
  default: Closed
  values:
    1: Pending
    2: Initiated
    3: Started
    4: Closed
    5: Canceled
    6: Expired

# JackpotWheelStatusType — confirmed via live ES aggregation:
# statusId=4 is "Closed" (capitalized, 1.08M docs); other ids are UPPERCASE.
jackpot_wheel_status:
  default: Closed
  values:
    1: PENDING
    2: INITIATED
    3: STARTED
    4: Closed
    5: CANCELED
    6: EXPIRED

